name: UI CI & Auto-Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Automated Test Suite
        run: npm test

  deploy-web:
    name: Auto-Deploy Web UI to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Export Static Web Bundle
        env:
          EXPO_PUBLIC_API_URL: https://myhealthapp-backend.onrender.com/api/v1
          EXPO_BASE_URL: /myhealthapp
        run: npx expo export -p web

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-apk:
    name: Build Android APK
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Try EAS Cloud Build (if quota available)
        run: |
          if [ -n "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Attempting EAS Cloud Build..."
            eas build --platform android --profile preview --non-interactive --no-wait || echo "EAS Cloud quota reached or failed; will compile APK locally on runner."
          fi

      - name: Prebuild Native Android Project
        env:
          EXPO_PUBLIC_API_URL: https://myhealthapp-backend.onrender.com/api/v1
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Standalone Android Release APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myhealthapp-preview-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Update GitHub Release with Standalone APK
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Publishing release APK $APK_PATH to v0.1.0-preview..."
            gh release upload v0.1.0-preview "$APK_PATH" --clobber --repo ${{ github.repository }} || \
            gh release create v0.1.0-preview "$APK_PATH" --title "MyHealth Android Preview" --notes "Standalone Android Release APK with embedded offline JavaScript, calm clinical sapphire theme, and functional dose tracking." --prerelease --repo ${{ github.repository }}
          fi
