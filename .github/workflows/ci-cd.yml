name: UI CI & Auto-Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Automated Test Suite
        run: npm test

  deploy-web:
    name: Auto-Deploy Web UI to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Export Static Web Bundle
        env:
          EXPO_PUBLIC_API_URL: https://myhealthapp-backend.onrender.com/api/v1
        run: npx expo export -p web

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-apk:
    name: Trigger EAS Android APK Build
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS Build for Android APK
        run: |
          if [ -n "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Starting EAS Build for Android APK (preview profile)..."
            eas build --platform android --profile preview --non-interactive --no-wait
            echo "EAS Build successfully submitted to Expo Cloud!"
          else
            echo "EXPO_TOKEN secret not found in repository secrets."
            echo "To enable automated EAS APK builds on every git push:"
            echo "1. Go to https://expo.dev/settings/access-tokens and create an access token."
            echo "2. Add it to GitHub repository Secrets as 'EXPO_TOKEN'."
          fi
