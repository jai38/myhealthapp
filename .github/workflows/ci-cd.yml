name: UI CI & Auto-Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Automated Test Suite
        run: npm test

  deploy-web:
    name: Auto-Deploy Web UI to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Export Static Web Bundle
        env:
          EXPO_PUBLIC_API_URL: https://myhealthapp-backend.onrender.com/api/v1
          EXPO_BASE_URL: /myhealthapp
        run: npx expo export -p web

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # One APK per backend until cutover: Render keeps v0.1.0-preview, AWS gets its own release.
  build-android-apk:
    name: Build Android APK (${{ matrix.backend }})
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: render
            api_url: https://myhealthapp-backend.onrender.com/api/v1
            release_tag: v0.1.0-preview
            release_title: MyHealth Android Preview
            eas_profile: preview
          - backend: aws
            api_url: https://b3tvclkxnc.execute-api.ap-south-1.amazonaws.com/api/v1
            release_tag: v0.2.0-aws-preview
            release_title: MyHealth Android Preview (AWS Mumbai)
            eas_profile: ''
    env:
      EXPO_PUBLIC_API_URL: ${{ matrix.api_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Try EAS Cloud Build (if quota available)
        if: matrix.eas_profile != ''
        run: |
          if [ -n "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Attempting EAS Cloud Build..."
            eas build --platform android --profile ${{ matrix.eas_profile }} --non-interactive --no-wait || echo "EAS Cloud quota reached or failed; will compile APK locally on runner."
          fi

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Standalone Android Release APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myhealthapp-preview-apk-${{ matrix.backend }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Update GitHub Release with Standalone APK
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Publishing release APK $APK_PATH to ${{ matrix.release_tag }}..."
            gh release upload "${{ matrix.release_tag }}" "$APK_PATH" --clobber --repo ${{ github.repository }} || \
            gh release create "${{ matrix.release_tag }}" "$APK_PATH" --title "${{ matrix.release_title }}" --notes "Standalone Android Release APK. API: ${{ matrix.api_url }}. Test accounts and synthetic data only." --prerelease --repo ${{ github.repository }}
          fi
